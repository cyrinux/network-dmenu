# Only libdbus is needed at link time (notify-rust); openssl is vendored and
# glib was a leftover from the removed GTK UI. --no-install-recommends keeps
# arm64 python out of the image: its postinst cannot execute on the x86_64 host.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev:arm64 pkg-config"
]

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends libdbus-1-dev pkg-config"
]
