[package]
name = "network-dmenu"
version = "3.1.0"
edition = "2021"
authors = ["Cyril Levis"]
categories = ["gui"]
keywords = ["tailscale", "dmenu", "network", "vpn", "wifi"]
description = "A dmenu-based network knife tools, Tailscale, Wi-Fi network, mullvad, nextdns."
readme = "README.md"
license = "ISC"
homepage = "https://github.com/cyrinux/network-dmenu"
repository = "https://github.com/cyrinux/network-dmenu"

[features]
default = ["firewalld", "tailscale"]
firewalld = []
tailscale = []

[dependencies]
dirs = "7.0"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false }
toml = { version = "1.1", features = ["parse", "serde"], default-features = false }
regex = "1.11"
reqwest = { version = "0.13", features = ["blocking", "native-tls-vendored", "json"], default-features = false }
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
notify-rust = { version = "4", default-features = false, features = ["dbus"] }
which = "8.0"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "process",
  "signal",
  "fs",
  "io-util",
], default-features = false }
webbrowser = "1.2"
country-emoji = "0.3"
clap = { version = "4", features = [
  "suggestions",
  "help",
  "usage",
  "color",
  "derive",
  "std",
], default-features = false }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.21"


[dev-dependencies]
mockall = "0.15"
tokio-test = "0.4"
tempfile = "3.23"
